name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Type-check (mypy)
        run: uv run mypy
      - name: Tests (no models, no MIMIC, no Synthea output; those tests skip)
        run: uv run pytest
      - name: Guard - no data, weights or secrets tracked; no MIMIC in fixtures
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          if git ls-files | grep -iE '\.(csv|tsv|parquet|db|duckdb|sqlite3?|jsonl|gguf|safetensors|bin|pt|pth|ckpt|feather|arrow|xlsx?|npy|npz|h5|onnx|pkl|pickle|joblib|gz|zip|7z|tar)(\.gz)?$'; then
            echo "::error::Data files, weights or archives are committed"; exit 1
          fi
          if git ls-files | grep -iE '(^|/)\.env(\.[^/]*)?$' | grep -viE '(^|/)\.env\.example$'; then
            echo "::error::A .env file is committed (only .env.example may be)"; exit 1
          fi
          ignored=$(git -c core.ignorecase=true ls-files -ci --exclude-standard)
          if [ -n "$ignored" ]; then
            printf '%s\n' "$ignored"
            echo "::error::Tracked files match .gitignore"; exit 1
          fi
          if git grep -niE '\bmimic(-iv|-iii)?\b' -- synthetic tests/fixtures.py; then
            echo "::error::MIMIC references in synthetic fixtures"; exit 1
          fi
          echo "OK"
