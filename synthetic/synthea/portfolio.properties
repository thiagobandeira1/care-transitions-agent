# Synthea settings used to generate this project's synthetic patients (Synthea commit d9d07a6).
# Copy this file into a Synthea checkout at that commit and run, from there (see the README, Run it):
#   ./run_synthea -c portfolio.properties -s 20260830 -cs 1788128736677 -r 20260830 -e 20260830 \
#     -p 2000 -a 65-95 Florida
# run_synthea takes dates to the day, so counts can differ slightly from the original run.
# The output is fully synthetic.
exporter.baseDirectory = ./output
exporter.fhir.export = true
exporter.fhir.use_us_core_ig = true
exporter.csv.export = true
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.years_of_history = 10
